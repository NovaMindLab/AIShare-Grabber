<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="auto">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    
    <linearGradient id="cyanBeam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <linearGradient id="phoneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="pcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#030712" stop-opacity="0.95" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    /* Typography & Core */
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-weight: 700; fill: #f8fafc; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #94a3b8; font-weight: 500; }
    .badge-text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 10px; font-weight: 700; }
    
    /* Grid Mesh */
    .grid-line { stroke: #1e293b; stroke-width: 1; stroke-opacity: 0.35; }

    /* Animated Streams */
    .highway-line {
      stroke: url(#cyanBeam);
      stroke-width: 3;
      stroke-dasharray: 8 8;
      animation: highwayRun 1.2s infinite linear;
    }
    @keyframes highwayRun {
      to { stroke-dashoffset: -32; }
    }

    .ble-arc {
      stroke: #a855f7;
      stroke-width: 2;
      stroke-dasharray: 6 6;
      animation: bleRun 2s infinite linear;
    }
    @keyframes bleRun {
      to { stroke-dashoffset: -24; }
    }

    /* Pulsating Waves */
    .pulse-ring {
      fill: none;
      stroke-width: 2;
      animation: ringPulse 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
    }
    @keyframes ringPulse {
      0% { r: 16; opacity: 0.9; stroke: #38bdf8; }
      100% { r: 65; opacity: 0; stroke: #818cf8; }
    }

    .pulse-ring-ble {
      fill: none;
      stroke-width: 2;
      animation: bleRingPulse 2.4s cubic-bezier(0.2, 0.8, 0.2, 1) infinite;
      animation-delay: 1.2s;
    }
    @keyframes bleRingPulse {
      0% { r: 14; opacity: 0.9; stroke: #c084fc; }
      100% { r: 55; opacity: 0; stroke: #7c3aed; }
    }

    /* Flying Photo Cards */
    .flying-card-1 { animation: fly1 3.2s infinite cubic-bezier(0.4, 0, 0.2, 1); }
    .flying-card-2 { animation: fly2 3.2s infinite cubic-bezier(0.4, 0, 0.2, 1); animation-delay: 1.07s; }
    .flying-card-3 { animation: fly3 3.2s infinite cubic-bezier(0.4, 0, 0.2, 1); animation-delay: 2.14s; }

    @keyframes fly1 {
      0% { transform: translate(160px, 230px) scale(0.4); opacity: 0; }
      15% { opacity: 1; transform: translate(260px, 205px) scale(0.95); }
      50% { transform: translate(460px, 185px) scale(1.05); opacity: 1; }
      85% { opacity: 1; transform: translate(680px, 215px) scale(0.95); }
      100% { transform: translate(780px, 235px) scale(0.4); opacity: 0; }
    }
    @keyframes fly2 {
      0% { transform: translate(160px, 230px) scale(0.4); opacity: 0; }
      15% { opacity: 1; transform: translate(260px, 205px) scale(0.95); }
      50% { transform: translate(460px, 185px) scale(1.05); opacity: 1; }
      85% { opacity: 1; transform: translate(680px, 215px) scale(0.95); }
      100% { transform: translate(780px, 235px) scale(0.4); opacity: 0; }
    }
    @keyframes fly3 {
      0% { transform: translate(160px, 230px) scale(0.4); opacity: 0; }
      15% { opacity: 1; transform: translate(260px, 205px) scale(0.95); }
      50% { transform: translate(460px, 185px) scale(1.05); opacity: 1; }
      85% { opacity: 1; transform: translate(680px, 215px) scale(0.95); }
      100% { transform: translate(780px, 235px) scale(0.4); opacity: 0; }
    }

    /* Floating Particles */
    .particle-stream {
      fill: #38bdf8;
      animation: particleMove 1.6s infinite linear;
    }
    @keyframes particleMove {
      0% { transform: translate(0, 0); opacity: 0; }
      20% { opacity: 1; }
      80% { opacity: 1; }
      100% { transform: translate(580px, 0); opacity: 0; }
    }

    /* Glow Dots */
    .live-dot {
      animation: blink 1.2s infinite alternate ease-in-out;
    }
    @keyframes blink {
      0% { opacity: 0.4; }
      100% { opacity: 1; filter: drop-shadow(0 0 6px #10b981); }
    }
  </style>

  <!-- Background Base -->
  <rect width="960" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Dynamic Cyber Grid -->
  <g class="grid-line">
    <line x1="0" y1="70" x2="960" y2="70" />
    <line x1="0" y1="140" x2="960" y2="140" />
    <line x1="0" y1="210" x2="960" y2="210" />
    <line x1="0" y1="280" x2="960" y2="280" />
    <line x1="0" y1="350" x2="960" y2="350" />
    <line x1="120" y1="0" x2="120" y2="420" />
    <line x1="280" y1="0" x2="280" y2="420" />
    <line x1="480" y1="0" x2="480" y2="420" />
    <line x1="680" y1="0" x2="680" y2="420" />
    <line x1="840" y1="0" x2="840" y2="420" />
  </g>

  <!-- Flow Paths & Beams -->
  <!-- Top: BLE Signaling Arc -->
  <path d="M 180 120 Q 480 30 780 120" fill="none" class="ble-arc" filter="url(#glowPurple)" />
  
  <!-- Middle: WebRTC Multi-lane Highway -->
  <path d="M 180 240 Q 480 180 780 240" fill="none" stroke="#0ea5e9" stroke-width="20" stroke-opacity="0.1" />
  <path d="M 180 240 Q 480 180 780 240" fill="none" stroke="#38bdf8" stroke-width="8" stroke-opacity="0.25" />
  <path d="M 180 240 Q 480 180 780 240" fill="none" class="highway-line" filter="url(#glowCyan)" />

  <!-- Pulsating Wave Emitters -->
  <circle cx="180" cy="120" class="pulse-ring-ble" />
  <circle cx="180" cy="240" class="pulse-ring" />
  <circle cx="780" cy="240" class="pulse-ring" style="animation-delay: 0.8s;" />

  <!-- Particle Stream -->
  <g transform="translate(180, 238)">
    <circle cx="0" cy="0" r="3.5" class="particle-stream" style="animation-delay: 0s;" />
    <circle cx="0" cy="-3" r="2.5" class="particle-stream" style="animation-delay: 0.4s; fill: #a855f7;" />
    <circle cx="0" cy="3" r="3" class="particle-stream" style="animation-delay: 0.8s; fill: #38bdf8;" />
    <circle cx="0" cy="0" r="2.5" class="particle-stream" style="animation-delay: 1.2s; fill: #67e8f9;" />
  </g>

  <!-- Flying Dynamic Photo Cards -->
  <!-- Card 1 -->
  <g class="flying-card-1" filter="url(#shadow)">
    <rect x="-32" y="-24" width="64" height="48" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.8" />
    <rect x="-28" y="-20" width="56" height="34" rx="5" fill="#0284c7" fill-opacity="0.85" />
    <circle cx="-14" cy="-8" r="5" fill="#fef08a" />
    <polygon points="-28,14 -10,-2 6,14" fill="#0369a1" />
    <polygon points="-6,14 10,4 28,14" fill="#0c4a6e" />
    <rect x="-26" y="17" width="30" height="3" rx="1.5" fill="#94a3b8" />
    <text x="14" y="20" font-family="sans-serif" font-size="6" fill="#38bdf8" font-weight="bold">4K RAW</text>
  </g>

  <!-- Card 2 (AI Semantic Tag) -->
  <g class="flying-card-2" filter="url(#shadow)">
    <rect x="-32" y="-24" width="64" height="48" rx="8" fill="#1e1b4b" stroke="#c084fc" stroke-width="1.8" />
    <rect x="-28" y="-20" width="56" height="34" rx="5" fill="#7c3aed" fill-opacity="0.8" />
    <circle cx="0" cy="-6" r="10" fill="#a855f7" fill-opacity="0.6" />
    <text x="0" y="-2" text-anchor="middle" font-size="11">📸</text>
    <rect x="-26" y="17" width="22" height="3" rx="1.5" fill="#c084fc" />
    <text x="8" y="20" font-family="sans-serif" font-size="6" fill="#c084fc" font-weight="bold">512-D CLIP</text>
  </g>

  <!-- Card 3 -->
  <g class="flying-card-3" filter="url(#shadow)">
    <rect x="-32" y="-24" width="64" height="48" rx="8" fill="#0f2027" stroke="#34d399" stroke-width="1.8" />
    <rect x="-28" y="-20" width="56" height="34" rx="5" fill="#059669" fill-opacity="0.85" />
    <circle cx="0" cy="-5" r="9" fill="#10b981" fill-opacity="0.6" />
    <text x="0" y="-1" text-anchor="middle" font-size="10">👤</text>
    <rect x="-26" y="17" width="26" height="3" rx="1.5" fill="#a7f3d0" />
    <text x="8" y="20" font-family="sans-serif" font-size="6" fill="#34d399" font-weight="bold">FACE ID</text>
  </g>

  <!-- LEFT NODE: Android Smartphone -->
  <g transform="translate(60, 60)" filter="url(#shadow)">
    <!-- Device Frame -->
    <rect x="0" y="0" width="160" height="270" rx="24" fill="url(#phoneGrad)" stroke="#334155" stroke-width="2.5" />
    <rect x="6" y="6" width="148" height="258" rx="20" fill="#090d16" />
    <!-- Dynamic Glow Edge -->
    <rect x="6" y="6" width="148" height="258" rx="20" fill="none" stroke="#818cf8" stroke-width="1" stroke-opacity="0.4" />
    
    <!-- Top Notch & Camera -->
    <rect x="55" y="14" width="50" height="10" rx="5" fill="#1e293b" />
    <circle cx="92" cy="19" r="2.5" fill="#38bdf8" />

    <!-- App Screen UI -->
    <!-- App Bar -->
    <rect x="18" y="38" width="124" height="30" rx="8" fill="#1e1b4b" fill-opacity="0.6" stroke="#4338ca" stroke-width="1" />
    <circle cx="34" cy="53" r="5" fill="#a855f7" />
    <text x="46" y="57" class="title-text" font-size="11" fill="#e0e7ff">ShareCLIP Mobile</text>

    <!-- Real-time Status Card -->
    <rect x="18" y="78" width="124" height="68" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <circle cx="32" cy="94" r="4" fill="#10b981" class="live-dot" />
    <text x="42" y="97" class="badge-text" fill="#34d399">P2P CONNECTED</text>
    <text x="30" y="116" class="sub-text" font-size="10">Syncing 4K Gallery</text>
    <text x="30" y="132" class="title-text" font-size="14" fill="#38bdf8">82.6 MB/s</text>

    <!-- Mini Thumbnail Grid -->
    <g transform="translate(18, 156)">
      <rect x="0" y="0" width="36" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="44" y="0" width="36" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="88" y="0" width="36" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="42" width="36" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="44" y="42" width="36" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="88" y="42" width="36" height="36" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
    </g>

    <!-- Device Label Badge -->
    <rect x="25" y="280" width="110" height="24" rx="12" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.2" />
    <text x="80" y="296" text-anchor="middle" class="badge-text" fill="#d8b4fe">📱 FLUTTER CLIENT</text>
  </g>

  <!-- RIGHT NODE: Desktop PC Station -->
  <g transform="translate(740, 50)" filter="url(#shadow)">
    <!-- Monitor Display Frame -->
    <rect x="0" y="0" width="170" height="220" rx="14" fill="url(#pcGrad)" stroke="#334155" stroke-width="2.5" />
    <rect x="6" y="6" width="158" height="208" rx="10" fill="#040711" />
    <rect x="6" y="6" width="158" height="208" rx="10" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.35" />

    <!-- Monitor Stand -->
    <path d="M 65 220 L 55 260 L 115 260 L 105 220 Z" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <rect x="40" y="258" width="90" height="8" rx="4" fill="#0f172a" stroke="#334155" stroke-width="1" />

    <!-- Desktop App UI -->
    <!-- Window Bar -->
    <rect x="14" y="14" width="142" height="18" rx="4" fill="#0f172a" />
    <circle cx="24" cy="23" r="3" fill="#ef4444" />
    <circle cx="33" cy="23" r="3" fill="#f59e0b" />
    <circle cx="42" cy="23" r="3" fill="#10b981" />
    <text x="56" y="26" class="sub-text" font-size="8" fill="#64748b">ShareCLIP Desktop AI</text>

    <!-- AI Inference Status Card -->
    <rect x="14" y="40" width="142" height="70" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
    <text x="24" y="56" class="badge-text" fill="#38bdf8">🧠 LOCAL ONNX + SIMD</text>
    <text x="24" y="72" class="sub-text" font-size="9">Zero-Copy RAM RingBuffer</text>
    <!-- Progress Bar -->
    <rect x="24" y="82" width="122" height="6" rx="3" fill="#1e293b" />
    <rect x="24" y="82" width="98" height="6" rx="3" fill="url(#cyanBeam)" />
    <text x="24" y="101" class="sub-text" font-size="8" fill="#34d399">Cluster: 1,420 Photos / 0.8s</text>

    <!-- Gallery Tiles Simulation -->
    <g transform="translate(14, 120)">
      <rect x="0" y="0" width="43" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="49" y="0" width="43" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="98" y="0" width="43" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="0" y="46" width="43" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="49" y="46" width="43" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="98" y="46" width="43" height="40" rx="4" fill="#1e293b" stroke="#334155" stroke-width="1" />
    </g>

    <!-- Device Label Badge -->
    <rect x="25" y="280" width="120" height="24" rx="12" fill="#0f2027" stroke="#38bdf8" stroke-width="1.2" />
    <text x="85" y="296" text-anchor="middle" class="badge-text" fill="#7dd3fc">🖥️ ELECTRON + AI</text>
  </g>

  <!-- CENTER HUD BADGES -->
  <!-- Top BLE Pill -->
  <g transform="translate(370, 20)" filter="url(#shadow)">
    <rect x="0" y="0" width="220" height="30" rx="15" fill="#1e1b4b" stroke="#a855f7" stroke-width="1.5" />
    <circle cx="18" cy="15" r="4" fill="#c084fc" class="live-dot" />
    <text x="32" y="19" class="badge-text" fill="#f3e8ff">1. BLE SIGNALING (OFFLINE SDP)</text>
  </g>

  <!-- Middle WebRTC Pill -->
  <g transform="translate(345, 305)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="34" rx="17" fill="#0f2027" stroke="#38bdf8" stroke-width="1.5" />
    <circle cx="20" cy="17" r="5" fill="#38bdf8" class="live-dot" />
    <text x="36" y="22" class="badge-text" fill="#e0f2fe" font-size="11">2. WEBRTC P2P GIGABIT DATACHANNEL</text>
  </g>

  <!-- Bottom Metrics Ticker -->
  <g transform="translate(240, 365)">
    <rect x="0" y="0" width="480" height="36" rx="10" fill="#0b1329" stroke="#1e293b" stroke-width="1" />
    <text x="40" y="22" class="sub-text" fill="#94a3b8">⚡ <b>Throughput:</b> <tspan fill="#38bdf8">80~120 MB/s</tspan></text>
    <text x="210" y="22" class="sub-text" fill="#94a3b8">🔒 <b>Privacy:</b> <tspan fill="#34d399">100% Zero-Cloud</tspan></text>
    <text x="360" y="22" class="sub-text" fill="#94a3b8">📶 <b>Latency:</b> <tspan fill="#c084fc">&lt; 1ms Direct</tspan></text>
  </g>
</svg>
