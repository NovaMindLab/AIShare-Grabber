name: 🚀 ShareCLIP Multi-Platform Cloud Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release Version (e.g. 2.1.10)'
        required: false
        default: ''

permissions:
  contents: write
  pages: write
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────────────────────
  # Job 1: Build & Deploy Web Portal & WebShare to GitHub Pages
  # ─────────────────────────────────────────────────────────────
  build-and-deploy-web:
    name: 🌐 Build & Deploy Web Portal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            webshare/package-lock.json

      - name: Build Official Website
        run: |
          cd web
          npm ci
          npm run build

      - name: Build WebShare
        run: |
          cd webshare
          npm ci
          npm run build

      - name: Assemble Static Site
        run: |
          mkdir -p site_dist
          cp -r web/dist/* site_dist/
          mkdir -p site_dist/webshare
          cp -r webshare/dist/* site_dist/webshare/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site_dist
          publish_branch: gh-pages
          force_orphan: false

  # ─────────────────────────────────────────────────────────────
  # Job 2: Build Android Universal APK (Linux Runner)
  # ─────────────────────────────────────────────────────────────
  build-android:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determine Version
        id: get_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          else
            TAG_VER="${GITHUB_REF#refs/tags/}"
          fi
          VER_CLEAN="${TAG_VER#v}"
          echo "VERSION=$VER_CLEAN" >> $GITHUB_OUTPUT
          # Calculate build number: e.g. 3.0.15 -> 30015
          IFS='.' read -r -a vparts <<< "$VER_CLEAN"
          if [ ${#vparts[@]} -ge 3 ]; then
            BUILD_NUM=$(( vparts[0] * 10000 + vparts[1] * 100 + vparts[2] ))
          else
            BUILD_NUM=30000
          fi
          echo "BUILD_NUMBER=$BUILD_NUM" >> $GITHUB_OUTPUT
          echo "Building Android version: $VER_CLEAN (build-number: $BUILD_NUM)"

      - name: Build Android Universal APK
        run: |
          cd android
          echo "Checking debug.keystore presence..."
          ls -la android/app/debug.keystore
          flutter pub get
          if [ -n "${{ secrets.MIXPANEL_TOKEN }}" ]; then
            flutter build apk --release --target-platform android-arm,android-arm64 --build-name "${{ steps.get_version.outputs.VERSION }}" --build-number "${{ steps.get_version.outputs.BUILD_NUMBER }}" --no-tree-shake-icons --dart-define=MIXPANEL_TOKEN=${{ secrets.MIXPANEL_TOKEN }}
          else
            flutter build apk --release --target-platform android-arm,android-arm64 --build-name "${{ steps.get_version.outputs.VERSION }}" --build-number "${{ steps.get_version.outputs.BUILD_NUMBER }}" --no-tree-shake-icons
          fi
          echo "Verifying APK signing certificate..."
          keytool -printcert -jarfile build/app/outputs/flutter-apk/app-release.apk | grep -i -E "(SHA1|SHA256):" || true
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/ShareCLIP-Android-${{ steps.get_version.outputs.VERSION }}.apk

      - name: Upload Android Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-android
          path: android/build/app/outputs/flutter-apk/ShareCLIP-Android-*.apk
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Job 3: Build Windows PC Installer (.exe)
  # ─────────────────────────────────────────────────────────────
  build-windows:
    name: 💻 Build Windows Desktop (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: cp_clip/package-lock.json

      - name: Build Windows Client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
        run: |
          cd cp_clip
          npm install
          npm run build
          npx electron-builder --win

      - name: 🔏 Self-Sign Windows Installer with RFC 3161 Timestamp (Free Authenticode)
        shell: pwsh
        run: |
          echo "==== Generating Local Code Signing Certificate ===="
          $cert = New-SelfSignedCertificate -Type CodeSigning -Subject "CN=ShareCLIP OpenSource, O=ShareCLIP Community" -KeyUsage DigitalSignature -KeyAlgorithm RSA -KeyLength 2048 -CertStoreLocation "Cert:\CurrentUser\My" -NotAfter (Get-Date).AddYears(5)
          $pwd = ConvertTo-SecureString -String "ShareCLIP2026" -Force -AsPlainText
          $pfxPath = "$PWD\cp_clip\dist_electron\shareclip_codesign.pfx"
          $cerPath = "$PWD\cp_clip\dist_electron\ShareCLIP-CodeSign.cer"
          Export-PfxCertificate -Cert $cert -FilePath $pfxPath -Password $pwd
          Export-Certificate -Cert $cert -FilePath $cerPath

          echo "==== Locating signtool.exe in Windows SDK ===="
          $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter "signtool.exe" -File -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like "*x64*" } | Select-Object -Last 1).FullName
          if (-not $signtool) {
            $signtool = (Get-ChildItem -Path "C:\Program Files (x86)\Windows Kits" -Recurse -Filter "signtool.exe" -File -ErrorAction SilentlyContinue | Select-Object -Last 1).FullName
          }
          echo "Using signtool at: $signtool"

          if ($signtool) {
            $exeFiles = Get-ChildItem -Path "cp_clip\dist_electron" -Filter "*.exe"
            foreach ($file in $exeFiles) {
              echo "Signing $($file.FullName) with DigiCert RFC 3161 Timestamp..."
              & $signtool sign /f "$pfxPath" /p "ShareCLIP2026" /fd sha256 /tr "http://timestamp.digicert.com" /td sha256 "$($file.FullName)"
            }
          } else {
            echo "signtool not found, skipping sign step"
          }

          # Copy 1-click certificate trust installer
          if (Test-Path "scripts\Install-Certificate.bat") {
            Copy-Item -Path "scripts\Install-Certificate.bat" -Destination "cp_clip\dist_electron\Install-Certificate.bat" -Force
          }
          # Clean up private key pfx
          Remove-Item -Path $pfxPath -Force -ErrorAction SilentlyContinue

      - name: Upload Windows Artifact
        id: upload-windows
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            cp_clip/dist_electron/*.exe
            cp_clip/dist_electron/*.blockmap
            cp_clip/dist_electron/latest.yml
            cp_clip/dist_electron/ShareCLIP-CodeSign.cer
            cp_clip/dist_electron/Install-Certificate.bat
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Job 4: Build macOS Desktop (.dmg & .zip for arm64 & x64)
  # ─────────────────────────────────────────────────────────────
  build-macos:
    name: 🍎 Build macOS Desktop (${{ matrix.arch }})
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build macOS Client (${{ matrix.arch }})
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          cd cp_clip
          npm install
          if [ "${{ matrix.arch }}" = "x64" ]; then
            echo "==== Preparing x86_64 native dependencies on Apple Silicon runner ===="
            npm install --no-save --force @img/sharp-darwin-x64
            curl -sL -o sqlite3_x64.tar.gz https://github.com/TryGhost/node-sqlite3/releases/download/v6.0.1/sqlite3-v6.0.1-napi-v6-darwin-x64.tar.gz
            tar -xzf sqlite3_x64.tar.gz
            mkdir -p node_modules/sqlite3/build/Release
            cp -f build/Release/node_sqlite3.node node_modules/sqlite3/build/Release/node_sqlite3.node
            rm -rf build sqlite3_x64.tar.gz
            echo "Checking architecture of node_sqlite3.node:"
            file node_modules/sqlite3/build/Release/node_sqlite3.node
          fi
          npm run build
          npx electron-builder --mac --${{ matrix.arch }}

      - name: 🍎 Enforce macOS Ad-hoc Codesigning & Gatekeeper Helper
        run: |
          echo "==== Verifying / Applying Ad-hoc Codesign on Mac outputs ===="
          find cp_clip/dist_electron -maxdepth 3 -name "*.app" -exec codesign --force --deep -s - {} \; 2>/dev/null || true
          
          # Copy macOS Gatekeeper bypass script
          if [ -f "scripts/Fix_App_Damage.command" ]; then
            cp scripts/Fix_App_Damage.command cp_clip/dist_electron/Fix_App_Damage.command
            chmod +x cp_clip/dist_electron/Fix_App_Damage.command
          fi

      - name: Upload macOS Artifact (${{ matrix.arch }})
        uses: actions/upload-artifact@v4
        with:
          name: release-macos-${{ matrix.arch }}
          path: |
            cp_clip/dist_electron/*.dmg
            cp_clip/dist_electron/*.zip
            cp_clip/dist_electron/Fix_App_Damage.command
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Job 5: Build Linux Desktop (.AppImage & .deb)
  # ─────────────────────────────────────────────────────────────
  build-linux:
    name: 🐧 Build Linux Desktop (.AppImage / .deb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libarchive-tools rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build Linux Client
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_MIXPANEL_TOKEN: ${{ secrets.MIXPANEL_TOKEN }}
        run: |
          cd cp_clip
          npm install
          npm run build
          npx electron-builder --linux

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            cp_clip/dist_electron/*.AppImage
            cp_clip/dist_electron/*.deb
          if-no-files-found: error

  # ─────────────────────────────────────────────────────────────
  # Job 6: Aggregate All Artifacts and Publish GitHub Release
  # ─────────────────────────────────────────────────────────────
  publish-release:
    name: 🚀 Publish GitHub Release
    needs: [build-and-deploy-web, build-android, build-windows, build-macos, build-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Determine Tag Name
        id: tag_info
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            INPUT_VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            INPUT_VER="${GITHUB_REF#refs/tags/}"
          else
            INPUT_VER="v$(node -p "require('./cp_clip/package.json').version")"
          fi
          if [[ $INPUT_VER != v* ]]; then
            FINAL_TAG="v$INPUT_VER"
          else
            FINAL_TAG="$INPUT_VER"
          fi
          echo "RELEASE_TAG=$FINAL_TAG" >> $GITHUB_OUTPUT
          echo "Release tag: $FINAL_TAG"

      - name: Download All Release Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist-artifacts

      - name: Prepare Release Directory
        run: |
          mkdir -p release-files
          find all-dist-artifacts -type f -exec cp {} release-files/ \;
          echo "==== Collected Release Files ===="
          ls -lh release-files

      - name: 🔏 Generate GitHub Artifact Attestations (Sigstore Public Code Signing)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'release-files/*'

      - name: Read Release Notes
        id: release_notes
        run: |
          if [ -f "auto_deploy/release_notes.md" ]; then
            echo "NOTES_FILE=auto_deploy/release_notes.md" >> $GITHUB_OUTPUT
          else
            echo "NOTES_FILE=" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag_info.outputs.RELEASE_TAG }}
          name: ShareCLIP ${{ steps.tag_info.outputs.RELEASE_TAG }}
          body_path: ${{ steps.release_notes.outputs.NOTES_FILE }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
