name: Deploy Website & WebShare to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            web/package-lock.json
            webshare/package-lock.json

      # 1. Build Official Landing Website (web/)
      - name: Build Official Website
        run: |
          cd web
          npm ci
          npm run build

      # 2. Build WebShare App (webshare/)
      - name: Build WebShare
        run: |
          cd webshare
          npm ci
          npm run build

      # 3. Assemble Unified GitHub Pages Distribution Folder
      - name: Assemble Static Site
        run: |
          mkdir -p site_dist
          # Copy main landing website to root
          cp -r web/dist/* site_dist/
          # Copy webshare to /webshare/ subpath
          mkdir -p site_dist/webshare
          cp -r webshare/dist/* site_dist/webshare/

      # 4. Upload GitHub Pages Artifact
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_dist

      # 5. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
