name: 📢 Automated Release Promotion & Distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to promote (e.g. v4.5.7)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-promotion-assets:
    name: 🚀 Automated Promotion, SEO & Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_VER="${{ github.event.release.tag_name }}"
          else
            TAG_VER="v$(node -p "try { require('./cp_clip/package.json').version } catch(e) { '4.5.7' }")"
          fi
          CLEAN_VER="${TAG_VER#v}"
          echo "TAG=$TAG_VER" >> $GITHUB_OUTPUT
          echo "CLEAN=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Promoting version: $TAG_VER ($CLEAN_VER)"

      - name: 🌐 Instant Search Engine Push (IndexNow & Bing)
        id: seo
        run: |
          echo "Running IndexNow push..."
          node scripts/seo-push.mjs || true

      - name: 📦 Generate & Sync Package Manager Manifests
        id: manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generating manifests for ${{ steps.ver.outputs.CLEAN }}..."
          node scripts/generate-package-manifests.mjs "${{ steps.ver.outputs.CLEAN }}"

      - name: 📝 Generate Multi-Channel Promotion Markdown
        run: |
          mkdir -p .github/promotion_output
          cat << 'EOF' > .github/promotion_output/release_announcement.md
          # 🚀 ShareCLIP ${{ steps.ver.outputs.TAG }} Released!

          > **The All-in-One Local-First Media Suite**: Private P2P AirDrop Alternative, On-Device AI Photo Search (MobileCLIP) & 4K Multi-Site Video Downloader.

          [![GitHub Stars](https://img.shields.io/github/stars/NovaMindLab/AIShare-Grabber?style=social)](https://github.com/NovaMindLab/AIShare-Grabber)
          [![Release](https://img.shields.io/github/v/release/NovaMindLab/AIShare-Grabber?color=6366f1)](https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }})
          [![License](https://img.shields.io/badge/license-MIT-green.svg)](https://github.com/NovaMindLab/AIShare-Grabber)

          ### 📦 Instant Downloads
          * 💻 [Windows 64-bit Installer (.exe)](https://github.com/NovaMindLab/AIShare-Grabber/releases/download/${{ steps.ver.outputs.TAG }}/ShareCLIP-Setup-${{ steps.ver.outputs.CLEAN }}.exe)
          * 📱 [Android Universal APK (.apk)](https://github.com/NovaMindLab/AIShare-Grabber/releases/download/${{ steps.ver.outputs.TAG }}/ShareCLIP-Android-${{ steps.ver.outputs.CLEAN }}.apk)
          * 🍎 [macOS Apple Silicon & Intel (.dmg)](https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }})
          * 🐧 [Linux AppImage & Deb](https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }})
          * 🌐 [Web Portal & WebShare P2P](https://novamindlab.github.io/AIShare-Grabber/)

          ### 🌟 Key Highlights in ${{ steps.ver.outputs.TAG }}
          - ⚡ **Zero Cloud P2P Sync (80+ MB/s)**: End-to-end local Wi-Fi transfer over WebRTC DataChannel.
          - 🧠 **On-Device AI Classification & Vector Search**: Embedded MobileCLIP2-S0 with 512-D local vector indexing.
          - 🎬 **Detached HTML5 Video Player**: Frameless always-on-top player window with Range 206 smooth streaming.
          - 🌐 **4K Multi-Site Video Downloader**: Universal engine for YouTube, Bilibili, Douyin, TikTok, X, and 1000+ sites.
          - 🎨 **AnimeGAN Video Studio**: Neural style transfer video converter powered by ONNX Runtime.
          - 🌍 **20-Language Full i18n**: 100% localized interface across desktop, mobile and web.

          💬 **Join our Community & Star on GitHub**: https://github.com/NovaMindLab/AIShare-Grabber
          EOF

      - name: 🔄 Enrich GitHub Release Description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.TAG }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Enriching Release $TAG notes..."
            ORIGINAL_NOTES=$(gh release view "$TAG" --json body -q .body || true)
            ANNOUNCEMENT=$(cat .github/promotion_output/release_announcement.md)
            NEW_BODY="${ANNOUNCEMENT}

          ---
          ### 📋 Detailed Change Log
          ${ORIGINAL_NOTES}"
            gh release edit "$TAG" --notes "$NEW_BODY" || true
            echo "Release notes updated successfully."
          else
            echo "Release $TAG not found via gh CLI, skipping notes enrichment."
          fi

      - name: 💾 Commit Updated Manifests & Sitemap (if modified)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/ web/public/sitemap.xml || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(manifests): update package manifests & sitemap for ${{ steps.ver.outputs.TAG }} [skip ci]"
            git push origin HEAD:${{ github.ref_name || 'main' }} || true
            echo "Committed updated manifests and sitemap."
          else
            echo "No manifest changes to commit."
          fi

      - name: 📢 Broadcast to Discord Webhook (if configured)
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\"📢 **ShareCLIP ${{ steps.ver.outputs.TAG }} Released!**\n\nPrivate P2P AirDrop Alternative + Local AI Photo Search + 4K Multi-Site Video Downloader!\n\n👉 Download now: https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }}\n🌟 Star on GitHub: https://github.com/NovaMindLab/AIShare-Grabber\"}" \
               $DISCORD_WEBHOOK || true

      - name: 📢 Broadcast to Telegram Channel (if configured)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="🚀 *ShareCLIP ${{ steps.ver.outputs.TAG }} Released!*%0A%0AThe All-in-One Local-First Media Suite (AirDrop Alternative + Local AI + 4K Downloader)%0A%0A📦 [Download Release](https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }})%0A⭐ [Star on GitHub](https://github.com/NovaMindLab/AIShare-Grabber)"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               -d "chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}&parse_mode=Markdown" || true

      - name: 📢 Broadcast to Custom Webhook (if configured)
        if: env.CUSTOM_WEBHOOK != ''
        env:
          CUSTOM_WEBHOOK: ${{ secrets.CUSTOM_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"🚀 ShareCLIP ${{ steps.ver.outputs.TAG }} 发布！\n私有局域网极速互传 + 本地 AI 搜图 + 4K 视频下载器\n下载直达: https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }}\"}}" \
               $CUSTOM_WEBHOOK || true

      - name: 📊 Write Action Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          ## 🚀 ShareCLIP ${{ steps.ver.outputs.TAG }} Automated Promotion Report

          | Channel / Action | Status | Details |
          |---|---|---|
          | 🌐 **Search Engine Push** | ✅ Executed | Pushed latest URLs & sitemap to Bing & IndexNow APIs |
          | 📦 **Package Manifests** | ✅ Updated | Synced Scoop (`shareclip.json`) & WinGet (`${{ steps.ver.outputs.CLEAN }}`) |
          | 📝 **Release Notes** | ✅ Enriched | Pushed multi-platform download cards to Release body |
          | 💬 **Discord Broadcast** | ${{ secrets.DISCORD_WEBHOOK != '' && '✅ Sent' || '⚠️ Skipped' }} | ${{ secrets.DISCORD_WEBHOOK != '' && 'Webhook triggered' || 'Secret `DISCORD_WEBHOOK` not configured' }} |
          | 💬 **Telegram Broadcast** | ${{ secrets.TELEGRAM_BOT_TOKEN != '' && '✅ Sent' || '⚠️ Skipped' }} | ${{ secrets.TELEGRAM_BOT_TOKEN != '' && 'Bot sent message' || 'Secrets `TELEGRAM_BOT_TOKEN`/`TELEGRAM_CHAT_ID` not configured' }} |
          | 💬 **Custom Webhook** | ${{ secrets.CUSTOM_WEBHOOK != '' && '✅ Sent' || '⚠️ Skipped' }} | ${{ secrets.CUSTOM_WEBHOOK != '' && 'Custom webhook triggered' || 'Secret `CUSTOM_WEBHOOK` not configured' }} |

          ### 📋 Ready-to-use Marketing Copy
          * Check repository `.github/promotion_output/release_announcement.md`
          * Community launch templates: [`marketing/`](https://github.com/NovaMindLab/AIShare-Grabber/tree/main/marketing)
          EOF

      - name: 📤 Archive Promotion Artifact
        uses: actions/upload-artifact@v4
        with:
          name: promotion-announcement-${{ steps.ver.outputs.CLEAN }}
          path: .github/promotion_output/release_announcement.md

