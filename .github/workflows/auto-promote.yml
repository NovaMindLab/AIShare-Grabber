name: 📢 Automated Release Promotion & Distribution

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag to promote (e.g. v4.5.8)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  generate-promotion-assets:
    name: 🚀 Automated Promotion, SEO & Distribution
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine Version
        id: ver
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG_VER="${{ github.event.inputs.version }}"
          elif [ -n "${{ github.event.release.tag_name }}" ]; then
            TAG_VER="${{ github.event.release.tag_name }}"
          else
            TAG_VER="v$(node -p "try { require('./cp_clip/package.json').version } catch(e) { '4.5.8' }")"
          fi
          CLEAN_VER="${TAG_VER#v}"
          echo "TAG=$TAG_VER" >> $GITHUB_OUTPUT
          echo "CLEAN=$CLEAN_VER" >> $GITHUB_OUTPUT
          echo "Promoting version: $TAG_VER ($CLEAN_VER)"

      - name: 📄 Generate Programmatic SEO Landing Pages
        id: pseo
        run: |
          if [ -f scripts/generate-pseo-pages.mjs ]; then
            echo "Generating programmatic SEO landing pages for ${{ steps.ver.outputs.CLEAN }}..."
            node scripts/generate-pseo-pages.mjs "${{ steps.ver.outputs.CLEAN }}"
          else
            echo "scripts/generate-pseo-pages.mjs not found, skipping."
          fi

      - name: 🌐 Instant Search Engine Push (IndexNow & Bing)
        id: seo
        run: |
          echo "Running IndexNow push for all landing pages..."
          node scripts/seo-push.mjs || true

      - name: 📦 Generate & Sync Package Manager Manifests
        id: manifests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Generating manifests for ${{ steps.ver.outputs.CLEAN }}..."
          node scripts/generate-package-manifests.mjs "${{ steps.ver.outputs.CLEAN }}"

      - name: 🪟 Automated WinGet Submission (vedantmgoyal2009/winget-releaser)
        id: winget_releaser
        if: env.WINGET_TOKEN != '' || env.PAT_TOKEN != ''
        continue-on-error: true
        uses: vedantmgoyal2009/winget-releaser@v2
        with:
          identifier: NovaMindLab.ShareCLIP
          version: ${{ steps.ver.outputs.CLEAN }}
          token: ${{ secrets.WINGET_TOKEN || secrets.PAT_TOKEN }}
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}

      - name: 🛡️ WinGet Fallback & Integrity Check
        id: winget_fallback
        run: |
          WINGET_DIR="manifests/winget/n/NovaMindLab/ShareCLIP/${{ steps.ver.outputs.CLEAN }}"
          if [ "${{ steps.winget_releaser.outcome }}" = "success" ]; then
            echo "WINGET_STATUS=✅ Automated PR Submitted via WinGet Releaser" >> $GITHUB_OUTPUT
            echo "WinGet automatic release successfully triggered via bot."
          elif [ "${{ steps.winget_releaser.outcome }}" = "failure" ]; then
            echo "WINGET_STATUS=⚠️ Fallback: Manifests Generated (Automated PR failed, check logs)" >> $GITHUB_OUTPUT
            echo "WinGet automated releaser failed, fallback to repository manifests in $WINGET_DIR."
          else
            echo "WINGET_STATUS=📦 Fallback: Manifests Generated (WINGET_TOKEN secret not configured)" >> $GITHUB_OUTPUT
            echo "WinGet releaser skipped, verified manifests ready in $WINGET_DIR."
          fi
          if [ -d "$WINGET_DIR" ]; then
            echo "Local WinGet 3-file package manifests exist and verified:"
            ls -la "$WINGET_DIR"
          fi

      # ─────────────────────────────────────────────────────────────
      # 🍦 Scoop Bucket Auto-Push
      # Pushes the updated shareclip.json to NovaMindLab/scoop-bucket.
      # Requires: PAT_TOKEN secret with repo scope on NovaMindLab/scoop-bucket.
      # One-time setup: create https://github.com/NovaMindLab/scoop-bucket repo
      # ─────────────────────────────────────────────────────────────
      - name: 🍦 Scoop Bucket Auto-Push
        id: scoop_push
        continue-on-error: true
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "SCOOP_STATUS=⚠️ Skipped (PAT_TOKEN not configured)" >> $GITHUB_OUTPUT
            echo "PAT_TOKEN not set, skipping Scoop bucket push."
            exit 0
          fi

          VER="${{ steps.ver.outputs.CLEAN }}"
          SCOOP_MANIFEST="manifests/scoop/shareclip.json"

          if [ ! -f "$SCOOP_MANIFEST" ]; then
            echo "SCOOP_STATUS=⚠️ Skipped (manifest not found)" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "==== Pushing Scoop manifest v${VER} to NovaMindLab/scoop-bucket ===="
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/NovaMindLab/scoop-bucket.git" /tmp/scoop-bucket
          mkdir -p /tmp/scoop-bucket/bucket
          cp "$SCOOP_MANIFEST" /tmp/scoop-bucket/bucket/shareclip.json

          cd /tmp/scoop-bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bucket/shareclip.json

          if git diff --staged --quiet; then
            echo "SCOOP_STATUS=✅ Already up-to-date" >> $GITHUB_OUTPUT
          else
            git commit -m "Update shareclip to ${VER}"
            git push origin HEAD:main
            echo "SCOOP_STATUS=✅ Pushed v${VER} to NovaMindLab/scoop-bucket" >> $GITHUB_OUTPUT
            echo "Scoop bucket updated to v${VER}."
          fi

      # ─────────────────────────────────────────────────────────────
      # 🍺 Homebrew Tap Auto-Push
      # Pushes shareclip.rb to NovaMindLab/homebrew-tap (your own tap repo).
      # Requires: PAT_TOKEN secret; one-time repo creation needed.
      # Install: brew install --cask NovaMindLab/homebrew-tap/shareclip
      # ─────────────────────────────────────────────────────────────
      - name: 🍺 Homebrew Tap Auto-Push
        id: homebrew_tap_push
        continue-on-error: true
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "HOMEBREW_STATUS=⚠️ Skipped (PAT_TOKEN not configured)" >> $GITHUB_OUTPUT
            echo "PAT_TOKEN not set, skipping Homebrew tap push."
            exit 0
          fi

          VER="${{ steps.ver.outputs.CLEAN }}"
          CASK_FILE="manifests/homebrew/shareclip.rb"

          if [ ! -f "$CASK_FILE" ]; then
            echo "HOMEBREW_STATUS=⚠️ Skipped (cask formula not found)" >> $GITHUB_OUTPUT
            exit 0
          fi

          echo "==== Pushing Homebrew Cask v${VER} to NovaMindLab/homebrew-tap ===="
          git clone "https://x-access-token:${PAT_TOKEN}@github.com/NovaMindLab/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Casks
          cp "$CASK_FILE" /tmp/homebrew-tap/Casks/shareclip.rb

          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/shareclip.rb

          if git diff --staged --quiet; then
            echo "HOMEBREW_STATUS=✅ Already up-to-date" >> $GITHUB_OUTPUT
          else
            git commit -m "shareclip ${VER}"
            git push origin HEAD:main
            echo "HOMEBREW_STATUS=✅ Pushed v${VER} to NovaMindLab/homebrew-tap" >> $GITHUB_OUTPUT
            echo "Homebrew tap updated to v${VER}."
          fi

      # ─────────────────────────────────────────────────────────────
      # 🤖 IzzyOnDroid APK Availability Check
      # After initial one-time issue submission, IzzyOnDroid's bot
      # auto-polls GitHub Releases. This step verifies APK is reachable.
      # ─────────────────────────────────────────────────────────────
      - name: 🤖 IzzyOnDroid APK Release Verification
        id: izzy_check
        continue-on-error: true
        run: |
          VER="${{ steps.ver.outputs.CLEAN }}"
          APK_URL="https://github.com/NovaMindLab/AIShare-Grabber/releases/download/v${VER}/ShareCLIP-Android-${VER}.apk"

          echo "==== Verifying APK availability for IzzyOnDroid bot ===="
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -L --head "$APK_URL")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "IZZY_STATUS=✅ APK reachable — IzzyOnDroid bot will auto-pick up v${VER}" >> $GITHUB_OUTPUT
            echo "APK publicly available: $APK_URL"
          else
            echo "IZZY_STATUS=⚠️ APK HTTP ${HTTP_STATUS} — release may still be processing" >> $GITHUB_OUTPUT
            echo "WARNING: APK returned HTTP $HTTP_STATUS"
          fi

          # Sync versionCode in metadata.json
          IZZY_META="manifests/izzyondroid/metadata.json"
          if [ -f "$IZZY_META" ]; then
            VERSION_CODE=$(echo "$VER" | tr -d '.' | sed 's/^0*//')
            node -e "
              const fs = require('fs');
              const meta = JSON.parse(fs.readFileSync('$IZZY_META', 'utf8'));
              meta.version = '$VER';
              meta.versionCode = parseInt('$VERSION_CODE') || meta.versionCode;
              meta.releaseDate = new Date().toISOString().split('T')[0];
              meta.apkAssetUrl = 'https://github.com/NovaMindLab/AIShare-Grabber/releases/download/v$VER/ShareCLIP-Android-$VER.apk';
              fs.writeFileSync('$IZZY_META', JSON.stringify(meta, null, 2), 'utf8');
              console.log('IzzyOnDroid metadata synced to v$VER');
            "
          fi

      - name: 📝 Generate Multi-Channel Promotion Markdown
        run: |
          mkdir -p .github/promotion_output
          cat << 'EOF' > .github/promotion_output/release_announcement.md
          # 🚀 ShareCLIP ${{ steps.ver.outputs.TAG }} Released!

          > **The All-in-One Local-First Media Suite**: Private P2P AirDrop Alternative, On-Device AI Photo Search (MobileCLIP) & 4K Multi-Site Video Downloader.

          [![GitHub Stars](https://img.shields.io/github/stars/NovaMindLab/AIShare-Grabber?style=social)](https://github.com/NovaMindLab/AIShare-Grabber)
          [![Release](https://img.shields.io/github/v/release/NovaMindLab/AIShare-Grabber?color=6366f1)](https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }})
          [![License](https://img.shields.io/badge/license-MIT-green.svg)](https://github.com/NovaMindLab/AIShare-Grabber)

          ### 📦 One-Click Package Manager Installation
          * **Windows (WinGet)**: `winget install NovaMindLab.ShareCLIP`
          * **macOS (Homebrew)**: `brew install --cask shareclip`
          * **Windows (Scoop)**: `scoop install https://raw.githubusercontent.com/NovaMindLab/AIShare-Grabber/main/manifests/scoop/shareclip.json`

          ### 💾 Direct Binary Downloads
          * 💻 [Windows 64-bit Installer (.exe)](https://github.com/NovaMindLab/AIShare-Grabber/releases/download/${{ steps.ver.outputs.TAG }}/ShareCLIP-Setup-${{ steps.ver.outputs.CLEAN }}.exe)
          * 📱 [Android Universal APK (.apk)](https://github.com/NovaMindLab/AIShare-Grabber/releases/download/${{ steps.ver.outputs.TAG }}/ShareCLIP-Android-${{ steps.ver.outputs.CLEAN }}.apk)
          * 🍎 [macOS Apple Silicon (.dmg)](https://github.com/NovaMindLab/AIShare-Grabber/releases/download/${{ steps.ver.outputs.TAG }}/ShareCLIP-Mac-${{ steps.ver.outputs.CLEAN }}-arm64.dmg)
          * 🍏 [macOS Intel x64 (.dmg)](https://github.com/NovaMindLab/AIShare-Grabber/releases/download/${{ steps.ver.outputs.TAG }}/ShareCLIP-Mac-${{ steps.ver.outputs.CLEAN }}-x64.dmg)
          * 🐧 [Linux AppImage](https://github.com/NovaMindLab/AIShare-Grabber/releases/download/${{ steps.ver.outputs.TAG }}/ShareCLIP-Linux-${{ steps.ver.outputs.CLEAN }}-x86_64.AppImage) & [Deb](https://github.com/NovaMindLab/AIShare-Grabber/releases/download/${{ steps.ver.outputs.TAG }}/ShareCLIP-Linux-${{ steps.ver.outputs.CLEAN }}-amd64.deb)
          * 🌐 [Web Portal & WebShare P2P](https://novamindlab.github.io/AIShare-Grabber/)

          ### 🌟 Key Highlights in ${{ steps.ver.outputs.TAG }}
          - ⚡ **Zero Cloud P2P Sync (80+ MB/s)**: End-to-end local Wi-Fi transfer over WebRTC DataChannel.
          - 🧠 **On-Device AI Classification & Vector Search**: Embedded MobileCLIP2-S0 with 512-D local vector indexing.
          - 🎬 **Detached HTML5 Video Player**: Frameless always-on-top player window with Range 206 smooth streaming.
          - 🌐 **4K Multi-Site Video Downloader**: Universal engine for YouTube, Bilibili, Douyin, TikTok, X, and 1000+ sites.
          - 🎨 **AnimeGAN Video Studio**: Neural style transfer video converter powered by ONNX Runtime.
          - 🌍 **20-Language Full i18n**: 100% localized interface across desktop, mobile and web.

          💬 **Join our Community & Star on GitHub**: https://github.com/NovaMindLab/AIShare-Grabber
          EOF

      - name: 🔄 Enrich GitHub Release Description
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.ver.outputs.TAG }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Enriching Release $TAG notes..."
            ORIGINAL_NOTES=$(gh release view "$TAG" --json body -q .body || true)
            ANNOUNCEMENT=$(cat .github/promotion_output/release_announcement.md)
            NEW_BODY="${ANNOUNCEMENT}

          ---
          ### 📋 Detailed Change Log
          ${ORIGINAL_NOTES}"
            gh release edit "$TAG" --notes "$NEW_BODY" || true
            echo "Release notes updated successfully."
          else
            echo "Release $TAG not found via gh CLI, skipping notes enrichment."
          fi

      - name: 💾 Commit Updated Manifests, pSEO Pages & Sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifests/ web/public/ || true
          if ! git diff --staged --quiet; then
            git commit -m "chore(distribution): sync package manifests, pSEO landing pages & sitemap for ${{ steps.ver.outputs.TAG }} [skip ci]"
            git push origin HEAD:${{ github.ref_name || 'main' }} || true
            echo "Committed updated manifests, pSEO pages, and sitemap."
          else
            echo "No file changes to commit."
          fi

      - name: 📢 Broadcast to Discord Webhook (if configured)
        if: env.DISCORD_WEBHOOK != ''
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"content\":\"📢 **ShareCLIP ${{ steps.ver.outputs.TAG }} Released!**\n\nPrivate P2P AirDrop Alternative + Local AI Photo Search + 4K Multi-Site Video Downloader!\n\n👉 Download now: https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }}\n🌟 Star on GitHub: https://github.com/NovaMindLab/AIShare-Grabber\"}" \
               $DISCORD_WEBHOOK || true

      - name: 📢 Broadcast to Telegram Channel (if configured)
        if: env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TEXT="🚀 *ShareCLIP ${{ steps.ver.outputs.TAG }} Released!*%0A%0AThe All-in-One Local-First Media Suite (AirDrop Alternative + Local AI + 4K Downloader)%0A%0A📦 [Download Release](https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }})%0A⭐ [Star on GitHub](https://github.com/NovaMindLab/AIShare-Grabber)"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
               -d "chat_id=${TELEGRAM_CHAT_ID}&text=${TEXT}&parse_mode=Markdown" || true

      - name: 📢 Broadcast to Custom Webhook (if configured)
        if: env.CUSTOM_WEBHOOK != ''
        env:
          CUSTOM_WEBHOOK: ${{ secrets.CUSTOM_WEBHOOK }}
        run: |
          curl -H "Content-Type: application/json" \
               -X POST \
               -d "{\"msgtype\":\"text\",\"text\":{\"content\":\"🚀 ShareCLIP ${{ steps.ver.outputs.TAG }} 发布！\n私有局域网极速互传 + 本地 AI 搜图 + 4K 视频下载器\n下载直达: https://github.com/NovaMindLab/AIShare-Grabber/releases/tag/${{ steps.ver.outputs.TAG }}\"}}" \
               $CUSTOM_WEBHOOK || true

      - name: 🌐 Multi-Channel Social & Developer Syndication (Bluesky, Mastodon, DEV.to)
        run: |
          if [ -f scripts/broadcast-release.mjs ]; then
            echo "Running developer syndication broadcast..."
            node scripts/broadcast-release.mjs "${{ steps.ver.outputs.TAG }}" || true
          fi
        env:
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
          DEVTO_PUBLISH: ${{ vars.DEVTO_PUBLISH || 'false' }}

      - name: 📊 Write Action Step Summary
        run: |
          cat << 'EOF' >> $GITHUB_STEP_SUMMARY
          # 🚀 ShareCLIP ${{ steps.ver.outputs.TAG }} Distribution & Promotion Report

          ## 📦 Package Manager & App Store Status

          | Channel / Manager | Ecosystem | Status | Distribution Details |
          |---|---|---|---|
          | 🪟 **Microsoft WinGet** | Windows 10/11 | ${{ steps.winget_fallback.outputs.WINGET_STATUS }} | `winget install NovaMindLab.ShareCLIP` (\`manifests/winget/\`) |
          | 🍦 **Scoop** | Windows CLI | ${{ steps.scoop_push.outputs.SCOOP_STATUS }} | `scoop install https://raw.githubusercontent.com/NovaMindLab/scoop-bucket/main/bucket/shareclip.json` |
          | 🍺 **Homebrew Tap** | macOS (Apple / Intel) | ${{ steps.homebrew_tap_push.outputs.HOMEBREW_STATUS }} | `brew install --cask NovaMindLab/homebrew-tap/shareclip` |
          | 🤖 **IzzyOnDroid** | Android FOSS | ${{ steps.izzy_check.outputs.IZZY_STATUS }} | APK auto-detected by IzzyOnDroid bot · App ID: `com.novamindlab.image_clip` |
          | 🐧 **Linux AppImage / .deb** | Ubuntu / Debian / Fedora | ✅ Artifacts Live | AppImage + Debian packages available on GitHub Releases |

          ---

          ## 🌐 Search Engine Push & Programmatic SEO (pSEO)

          | Pipeline | Status | Details |
          |---|---|---|
          | 📄 **pSEO Landing Pages** | ✅ Generated | Generated 8 high-intent pages: 4 Competitor Comparisons (`shareclip-vs-airdrop`, `shareclip-vs-localsend`, `shareclip-vs-google-photos`, `shareclip-vs-immich`) & 4 Feature Landing Pages (`airdrop-alternative-pc-android`, `local-ai-photo-search`, `p2p-file-transfer`, `universal-video-downloader`) |
          | 🗺️ **Sitemap Synchronization** | ✅ Refreshed | Auto-updated `web/public/sitemap.xml` with current lastmod timestamp |
          | ⚡ **IndexNow & Bing Push** | ✅ Executed | Real-time indexing push delivered to Bing and IndexNow endpoints |

          ---

          ## 📢 Notification Broadcasts

          | Notification Channel | Trigger Status | Note |
          |---|---|---|
          | 💬 **Discord Webhook** | ${{ secrets.DISCORD_WEBHOOK != '' && '✅ Sent' || '⚠️ Skipped' }} | ${{ secrets.DISCORD_WEBHOOK != '' && 'Delivered to Discord channel' || 'Secret `DISCORD_WEBHOOK` not configured' }} |
          | 💬 **Telegram Channel** | ${{ secrets.TELEGRAM_BOT_TOKEN != '' && '✅ Sent' || '⚠️ Skipped' }} | ${{ secrets.TELEGRAM_BOT_TOKEN != '' && 'Telegram message dispatched' || 'Secrets `TELEGRAM_BOT_TOKEN`/`TELEGRAM_CHAT_ID` not configured' }} |
          | 💬 **Custom Webhook** | ${{ secrets.CUSTOM_WEBHOOK != '' && '✅ Sent' || '⚠️ Skipped' }} | ${{ secrets.CUSTOM_WEBHOOK != '' && 'Custom webhook dispatched' || 'Secret `CUSTOM_WEBHOOK` not configured' }} |
          | 🦋 **Bluesky Syndication** | ${{ secrets.BLUESKY_HANDLE != '' && '✅ Dispatched' || '⚠️ Skipped' }} | ${{ secrets.BLUESKY_HANDLE != '' && 'Dispatched via AT Protocol' || 'Secret `BLUESKY_HANDLE` not configured' }} |
          | 🐘 **Mastodon Fediverse** | ${{ secrets.MASTODON_INSTANCE != '' && '✅ Dispatched' || '⚠️ Skipped' }} | ${{ secrets.MASTODON_INSTANCE != '' && 'Dispatched via Fediverse API' || 'Secret `MASTODON_INSTANCE` not configured' }} |
          | 👩‍💻 **DEV.to Community** | ${{ secrets.DEVTO_API_KEY != '' && '✅ Dispatched' || '⚠️ Skipped' }} | ${{ secrets.DEVTO_API_KEY != '' && 'Article published/drafted' || 'Secret `DEVTO_API_KEY` not configured' }} |

          ---

          ### 📋 Ready-to-Use Community Submissions
          * 🤖 **IzzyOnDroid Submission Guide**: [`marketing/izzyondroid_submission.md`](https://github.com/NovaMindLab/AIShare-Grabber/blob/main/marketing/izzyondroid_submission.md)
          * 🍺 **Homebrew Cask Submission Guide**: [`marketing/homebrew_cask_submission.md`](https://github.com/NovaMindLab/AIShare-Grabber/blob/main/marketing/homebrew_cask_submission.md)
          * 🎯 **AlternativeTo Submission**: [`marketing/alternativeto_submission.md`](https://github.com/NovaMindLab/AIShare-Grabber/blob/main/marketing/alternativeto_submission.md)
          * 📰 **Hacker News Show HN**: [`marketing/hacker_news_show_hn.md`](https://github.com/NovaMindLab/AIShare-Grabber/blob/main/marketing/hacker_news_show_hn.md)
          * 🐱 **Product Hunt Launch**: [`marketing/product_hunt_launch.md`](https://github.com/NovaMindLab/AIShare-Grabber/blob/main/marketing/product_hunt_launch.md)
          * 🇨🇳 **V2EX Showcase Post**: [`marketing/v2ex_release_post.md`](https://github.com/NovaMindLab/AIShare-Grabber/blob/main/marketing/v2ex_release_post.md)
          EOF

      - name: 📤 Archive Promotion Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: distribution-package-${{ steps.ver.outputs.CLEAN }}
          path: |
            .github/promotion_output/release_announcement.md
            manifests/
