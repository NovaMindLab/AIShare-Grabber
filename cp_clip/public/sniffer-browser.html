<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ShareCLIP 独立嗅探浏览器</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    body {
      background-color: #0b0f19;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ── Frameless Titlebar ──────────────────────────────────── */
    .titlebar {
      height: 42px;
      min-height: 42px;
      background: rgba(15, 23, 42, 0.95);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      padding: 0 8px 0 14px;
      -webkit-app-region: drag;
      z-index: 100;
      user-select: none;
    }
    .titlebar-left {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
      pointer-events: none;
    }
    .titlebar-logo {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.3px;
    }
    .titlebar-logo-icon {
      font-size: 16px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .titlebar-badge {
      font-size: 10px;
      background: rgba(99, 102, 241, 0.25);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
      padding: 1px 6px;
      border-radius: 4px;
      font-weight: 600;
    }

    /* Quick Site Chips */
    .titlebar-chips {
      display: flex;
      align-items: center;
      gap: 6px;
      margin: 0 12px;
      flex-shrink: 0;
    }
    .site-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
      -webkit-app-region: no-drag;
    }
    .site-chip:hover {
      background: rgba(99, 102, 241, 0.25);
      border-color: rgba(99, 102, 241, 0.5);
      color: #ffffff;
      transform: translateY(-1px);
    }

    /* Large Draggable Spacer */
    .titlebar-drag-spacer {
      flex: 1;
      height: 100%;
      min-width: 40px;
      -webkit-app-region: drag;
    }

    /* Window Controls */
    .titlebar-actions {
      display: flex;
      align-items: center;
      gap: 3px;
      -webkit-app-region: no-drag;
      flex-shrink: 0;
    }
    .tb-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      width: 34px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .tb-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #f8fafc;
    }
    .tb-btn-close:hover {
      background: #ef4444 !important;
      color: #ffffff !important;
    }

    /* ── Secondary Navigation Toolbar ────────────────────────── */
    .toolbar {
      height: 44px;
      min-height: 44px;
      background: rgba(18, 24, 38, 0.95);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      z-index: 90;
      -webkit-app-region: drag;
    }

    .nav-btn-group,
    .address-bar,
    .btn-ua,
    .btn-sniff {
      -webkit-app-region: no-drag;
    }

    .nav-btn-group {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav-btn {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: transparent;
      border: 1px solid transparent;
      color: #cbd5e1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .nav-btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .nav-btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    /* Omnibar / Address Input */
    .address-bar {
      flex: 1;
      height: 32px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 16px;
      display: flex;
      align-items: center;
      padding: 0 10px;
      gap: 8px;
      transition: all 0.2s ease;
    }
    .address-bar:focus-within {
      background: rgba(15, 23, 42, 0.9);
      border-color: #6366f1;
      box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.25);
    }
    .address-lock {
      font-size: 12px;
      color: #10b981;
      flex-shrink: 0;
    }
    .address-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: #f1f5f9;
      font-size: 12px;
      user-select: text;
    }
    .address-input::placeholder {
      color: #64748b;
    }
    .address-clear {
      font-size: 12px;
      color: #94a3b8;
      cursor: pointer;
      padding: 2px;
      display: none;
    }
    .address-clear:hover {
      color: #f1f5f9;
    }

    /* Primary Sniff CTA Button */
    .btn-sniff {
      height: 32px;
      padding: 0 16px;
      border-radius: 16px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6, #d946ef);
      background-size: 200% 200%;
      border: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
      transition: all 0.2s ease;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-sniff:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 16px rgba(168, 85, 247, 0.5);
      filter: brightness(1.1);
    }
    .btn-sniff:active:not(:disabled) {
      transform: translateY(0);
    }
    .btn-sniff:disabled {
      opacity: 0.7;
      cursor: wait;
      filter: grayscale(0.2);
    }

    /* Spinner Animation */
    .spin {
      display: inline-block;
      animation: spinAnim 1s linear infinite;
    }
    @keyframes spinAnim {
      100% { transform: rotate(360deg); }
    }

    /* UA Toggle Button */
    .btn-ua {
      height: 32px;
      padding: 0 10px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 11px;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .btn-ua:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* ── Webview Area ────────────────────────────────────────── */
    .webview-container {
      flex: 1;
      width: 100%;
      height: 100%;
      position: relative;
      background: #000000;
    }
    webview {
      width: 100%;
      height: 100%;
      border: none;
    }

    /* Loading progress bar */
    .loading-bar {
      position: absolute;
      top: 0;
      left: 0;
      height: 2px;
      background: linear-gradient(90deg, #6366f1, #a855f7, #38bdf8);
      width: 0%;
      transition: width 0.2s ease, opacity 0.4s ease;
      z-index: 10;
      opacity: 0;
    }

    /* ── Resolution Selection Modal ──────────────────────────── */
    .res-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(5, 8, 16, 0.78);
      backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      animation: modalFadeIn 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalFadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    .res-modal-card {
      width: 560px;
      max-width: 92vw;
      max-height: 86vh;
      background: #0f172a;
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 16px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.2);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: modalScaleIn 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalScaleIn {
      from { opacity: 0; transform: scale(0.94) translateY(12px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    .res-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(30, 41, 59, 0.5);
    }
    .res-modal-title {
      font-size: 14px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .res-modal-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      width: 28px;
      height: 28px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: all 0.15s ease;
    }
    .res-modal-close:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* Video Preview Header */
    .res-video-preview {
      display: flex;
      gap: 14px;
      padding: 16px 20px 12px 20px;
      align-items: center;
    }
    .res-thumb-box {
      position: relative;
      width: 140px;
      height: 80px;
      border-radius: 8px;
      overflow: hidden;
      background: #020617;
      border: 1px solid rgba(255, 255, 255, 0.1);
      flex-shrink: 0;
    }
    .res-thumb-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .res-thumb-duration {
      position: absolute;
      bottom: 4px;
      right: 4px;
      background: rgba(0, 0, 0, 0.82);
      color: #ffffff;
      font-size: 10px;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 4px;
      backdrop-filter: blur(2px);
    }
    .res-video-details {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .res-video-title {
      font-size: 13px;
      font-weight: 600;
      color: #f1f5f9;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .res-video-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      color: #94a3b8;
    }
    .res-platform-tag {
      background: rgba(99, 102, 241, 0.18);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 4px;
      padding: 1px 6px;
      font-weight: 600;
      font-size: 10px;
    }

    /* Subtitle prompt */
    .res-section-title {
      padding: 0 20px 8px 20px;
      font-size: 12px;
      font-weight: 600;
      color: #94a3b8;
    }

    /* Options List */
    .res-options-list {
      flex: 1;
      overflow-y: auto;
      padding: 2px 20px 14px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 310px;
    }
    .res-options-list::-webkit-scrollbar {
      width: 5px;
    }
    .res-options-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }

    .res-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .res-card:hover {
      background: rgba(99, 102, 241, 0.08);
      border-color: rgba(99, 102, 241, 0.4);
    }
    .res-card.active {
      background: rgba(99, 102, 241, 0.18);
      border-color: #6366f1;
      box-shadow: 0 0 14px rgba(99, 102, 241, 0.25);
    }

    .res-card-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .res-radio-circle {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }
    .res-card.active .res-radio-circle {
      border-color: #6366f1;
    }
    .res-radio-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: transparent;
      transition: all 0.15s ease;
    }
    .res-card.active .res-radio-dot {
      background: #818cf8;
    }

    .res-card-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .res-card-label-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .res-card-label {
      font-size: 13px;
      font-weight: 600;
      color: #f8fafc;
    }
    .res-pill {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 6px;
      border-radius: 4px;
      text-transform: uppercase;
    }
    .res-pill-4k {
      background: rgba(234, 179, 8, 0.2);
      color: #facc15;
      border: 1px solid rgba(234, 179, 8, 0.4);
    }
    .res-pill-2k {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    .res-pill-1080 {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.4);
    }
    .res-pill-720 {
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.4);
    }
    .res-pill-audio {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.4);
    }
    .res-pill-rec {
      background: linear-gradient(135deg, #6366f1, #d946ef);
      color: #ffffff;
    }

    .res-card-sub {
      font-size: 11px;
      color: #94a3b8;
    }
    .res-card-right {
      font-size: 12px;
      font-weight: 600;
      color: #cbd5e1;
      text-align: right;
    }

    /* Modal Footer */
    .res-modal-footer {
      padding: 14px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      background: rgba(30, 41, 59, 0.4);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .res-selection-summary {
      font-size: 12px;
      color: #94a3b8;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }
    .res-selection-summary strong {
      color: #a5b4fc;
    }
    .res-modal-actions {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-shrink: 0;
    }
    .res-btn-cancel {
      padding: 7px 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .res-btn-cancel:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
    }
    .res-btn-confirm {
      padding: 7px 18px;
      border-radius: 8px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border: none;
      color: #ffffff;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 2px 10px rgba(99, 102, 241, 0.35);
      transition: all 0.15s ease;
    }
    .res-btn-confirm:hover {
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.5);
      filter: brightness(1.1);
      transform: translateY(-1px);
    }
    .res-btn-confirm:active {
      transform: translateY(0);
    }

    /* ── Floating Download HUD Notification ──────────────────── */
    .floating-hud {
      position: fixed;
      bottom: 24px;
      right: 24px;
      width: 340px;
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid rgba(99, 102, 241, 0.35);
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(16px);
      padding: 14px 16px;
      z-index: 10000;
      display: none;
      flex-direction: column;
      gap: 8px;
      animation: hudSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes hudSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.96); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .hud-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .hud-title {
      font-size: 13px;
      font-weight: 700;
      color: #f8fafc;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hud-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 13px;
      padding: 2px 4px;
    }
    .hud-close:hover {
      color: #ffffff;
    }
    .hud-desc {
      font-size: 12px;
      color: #94a3b8;
      line-height: 1.4;
      word-break: break-all;
      max-height: 36px;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .hud-progress-bar {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .hud-progress-fill {
      height: 100%;
      background: linear-gradient(90deg, #6366f1, #10b981);
      width: 0%;
      transition: width 0.2s ease;
    }
    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      color: #a5b4fc;
    }
  </style>
</head>
<body>

  <!-- Frameless Titlebar -->
  <header class="titlebar" id="titlebar">
    <div class="titlebar-left">
      <div class="titlebar-logo">
        <span class="titlebar-logo-icon">🌐</span>
        <span id="txtLogoTitle" data-i18n="appTitle">ShareCLIP 独立嗅探浏览器</span>
      </div>
      <span class="titlebar-badge" data-i18n="immersiveBadge">大屏沉浸</span>
    </div>

    <!-- Quick Site Navigation Chips -->
    <div class="titlebar-chips">
      <div class="site-chip" data-url="https://m.youtube.com">
        <span>🔴</span><span>YouTube</span>
      </div>
      <div class="site-chip" data-url="https://www.bilibili.com">
        <span>⚡</span><span>哔哩哔哩</span>
      </div>
      <div class="site-chip" data-url="https://www.douyin.com">
        <span>🎵</span><span>抖音</span>
      </div>
      <div class="site-chip" data-url="https://www.tiktok.com">
        <span>🖤</span><span>TikTok</span>
      </div>
      <div class="site-chip" data-url="https://x.com">
        <span>🐦</span><span>X / Twitter</span>
      </div>
      <div class="site-chip" data-url="https://www.xiaohongshu.com">
        <span>📕</span><span>小红书</span>
      </div>
    </div>

    <!-- Large Draggable Spacer -->
    <div class="titlebar-drag-spacer"></div>

    <!-- Window Controls -->
    <div class="titlebar-actions">
      <button class="tb-btn" id="btnMin" data-i18n-title="minimize" title="最小化">─</button>
      <button class="tb-btn" id="btnMax" data-i18n-title="maximize" title="最大化">□</button>
      <button class="tb-btn tb-btn-close" id="btnClose" data-i18n-title="close" title="关闭">✕</button>
    </div>
  </header>

  <!-- Secondary Navigation & Omnibar -->
  <nav class="toolbar">
    <div class="nav-btn-group">
      <button class="nav-btn" id="btnBack" data-i18n-title="back" title="后退" disabled>←</button>
      <button class="nav-btn" id="btnForward" data-i18n-title="forward" title="前进" disabled>→</button>
      <button class="nav-btn" id="btnReload" data-i18n-title="reload" title="刷新页面">↻</button>
      <button class="nav-btn" id="btnHome" data-i18n-title="home" title="回到主页">🏠</button>
    </div>

    <div class="address-bar">
      <span class="address-lock" id="addrLock">🔒</span>

    let currentParsedVideo = null;
    let selectedResolution = null;

    const MOBILE_UA = "Mozilla/5.0 (Linux; Android 13; Pixel 7) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/116.0.0.0 Mobile Safari/537.36";
    const DESKTOP_UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36";

    // ── Helper Utilities ─────────────────────────────────────────
    function formatDuration(sec) {
      if (!sec || isNaN(sec)) return '';
      const s = Math.floor(sec);
      const hrs = Math.floor(s / 3600);
      const mins = Math.floor((s % 3600) / 60);
      const secs = s % 60;
      if (hrs > 0) {
        return `${hrs}:${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
      }
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    function formatFileSize(bytes) {
      if (!bytes || isNaN(bytes) || bytes <= 0) return '';
      if (bytes >= 1024 * 1024 * 1024) return (bytes / (1024 * 1024 * 1024)).toFixed(1) + ' GB';
      if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      if (bytes >= 1024) return (bytes / 1024).toFixed(0) + ' KB';
      return bytes + ' B';
    }

    function detectPlatformTag(url = '', extractor = '') {
      const target = `${url} ${extractor}`.toLowerCase();
      if (target.includes('youtube') || target.includes('youtu.be')) return { name: 'YouTube', icon: '▶️' };
      if (target.includes('bilibili') || target.includes('b23.tv')) return { name: 'Bilibili', icon: '⚡' };
      if (target.includes('douyin') || target.includes('tiktok')) return { name: 'TikTok/抖音', icon: '🎵' };
      if (target.includes('twitter') || target.includes('x.com')) return { name: 'X / Twitter', icon: '🐦' };
      if (target.includes('xiaohongshu')) return { name: '小红书', icon: '📕' };
      if (target.includes('kuaishou')) return { name: '快手', icon: '⚡' };
      return { name: 'Web', icon: '🌐' };
    }

    // 1. Window Controls & Titlebar Dragging
    btnMin.addEventListener('click', () => { window.api?.snifferWindowMinimize?.(); });
    btnMax.addEventListener('click', () => { window.api?.snifferWindowMaximize?.(); });
    btnClose.addEventListener('click', () => { window.api?.snifferWindowClose?.(); });
    document.getElementById('titlebar')?.addEventListener('dblclick', (e) => {
      if (e.target.closest('.site-chip') || e.target.closest('.tb-btn')) return;
      window.api?.snifferWindowMaximize?.();
    });

    // 2. Navigation controls
    btnBack.addEventListener('click', () => { if (webview.canGoBack()) webview.goBack(); });
    btnForward.addEventListener('click', () => { if (webview.canGoForward()) webview.goForward(); });
    btnReload.addEventListener('click', () => {
      if (webview.isLoading()) webview.stop();
      else webview.reload();
    });
    btnHome.addEventListener('click', () => {
      webview.loadURL('https://m.youtube.com');
    });

    // 3. Address bar enter
    function navigateToInput() {
      let raw = (urlInput.value || '').trim();
      if (!raw) return;
      if (!raw.startsWith('http://') && !raw.startsWith('https://')) {
        if (raw.includes('.') && !raw.includes(' ')) {
          raw = 'https://' + raw;
        } else {
          raw = 'https://www.google.com/search?q=' + encodeURIComponent(raw);
        }
      }
      webview.loadURL(raw);
    }

    urlInput.addEventListener('keyup', (e) => {
      if (e.key === 'Enter') navigateToInput();
      addrClear.style.display = urlInput.value ? 'inline-block' : 'none';
    });
    urlInput.addEventListener('input', () => {
      addrClear.style.display = urlInput.value ? 'inline-block' : 'none';
    });
    addrClear.addEventListener('click', () => {
      urlInput.value = '';
      addrClear.style.display = 'none';
      urlInput.focus();
    });

    // 4. Quick Site Chips
    document.querySelectorAll('.site-chip').forEach(chip => {
      chip.addEventListener('click', () => {
        const target = chip.getAttribute('data-url');
        if (target) webview.loadURL(target);
      });
    });

    // 5. User-Agent Switcher
    btnUa.addEventListener('click', () => {
      isMobileUa = !isMobileUa;
      if (isMobileUa) {
        uaIcon.innerText = '📱';
        uaLabel.innerText = t('mobileView');
        webview.setUserAgent(MOBILE_UA);
      } else {
        uaIcon.innerText = '💻';
        uaLabel.innerText = t('desktopView');
        webview.setUserAgent(DESKTOP_UA);
      }
      webview.reload();
    });

    // 6. Webview event listeners
    function updateNavState() {
      try {
        btnBack.disabled = !webview.canGoBack();
        btnForward.disabled = !webview.canGoForward();
        const curUrl = webview.getURL() || '';
        if (document.activeElement !== urlInput && curUrl && !curUrl.startsWith('data:')) {
          urlInput.value = curUrl;
          addrClear.style.display = 'none';
        }
        const title = webview.getTitle() || '';
        window.api?.triggerSnifferStatus?.({ url: curUrl, title });
      } catch (e) {}
    }

    webview.addEventListener('did-start-loading', () => {
      loadingBar.style.width = '35%';
      loadingBar.style.opacity = '1';
      btnReload.innerText = '✕';
      btnReload.title = t('stopReload');
      updateNavState();
    });

    webview.addEventListener('did-stop-loading', () => {
      loadingBar.style.width = '100%';
      setTimeout(() => {
        loadingBar.style.opacity = '0';
        loadingBar.style.width = '0%';
      }, 300);
      btnReload.innerText = '↻';
      btnReload.title = t('reload');
      updateNavState();
    });

    webview.addEventListener('did-navigate', updateNavState);
    webview.addEventListener('did-navigate-in-page', updateNavState);
    webview.addEventListener('page-title-updated', updateNavState);

    // 7. Floating Download HUD
    let hudTimer = null;
    function showHud(status, title, percent = 0, speed = '') {
      if (hudTimer) clearTimeout(hudTimer);
      hudStatus.innerText = status;
      hudTitle.innerText = title;
      hudProgress.style.width = percent + '%';
      hudPercent.innerText = percent ? (percent + '%') : '';
      hudSpeed.innerText = speed || t('hudEngine');
      floatingHud.style.display = 'flex';
      hudTimer = setTimeout(() => {
        floatingHud.style.display = 'none';
      }, 7000);
    }

    hudClose.addEventListener('click', () => {
      if (hudTimer) clearTimeout(hudTimer);
      floatingHud.style.display = 'none';
    });

    // 8. Resolution Selection Modal Functions
    function openResolutionModal(info) {
      if (!info || !info.resolutions || info.resolutions.length === 0) return;
      currentParsedVideo = info;

      // Fill Video Header
      modalVideoTitle.innerText = info.title || 'Video';
      modalVideoTitle.title = info.title || '';
      modalVideoThumb.src = info.thumbnail || '';
      modalVideoDuration.innerText = info.duration ? formatDuration(info.duration) : '';
      modalVideoDuration.style.display = info.duration ? 'block' : 'none';

      const tag = detectPlatformTag(info.webpage_url || webview.getURL(), info.extractor);
      modalPlatformTag.innerText = `${tag.icon} ${tag.name}`;
      modalVideoUploader.innerText = info.uploader ? `👤 ${info.uploader}` : '';
      modalVideoUploader.style.display = info.uploader ? 'inline-block' : 'none';

      // Render Resolutions
      resOptionsList.innerHTML = '';
      const list = info.resolutions || [];

      // Determine default selected: either isRecommended, or first video item, or first item
      const defaultItem = list.find(r => r.isRecommended || r.recommended) || list.find(r => r.type === 'video') || list[0];
      selectedResolution = defaultItem;

      list.forEach((resItem) => {
        const card = document.createElement('div');
        card.className = `res-card ${resItem === defaultItem ? 'active' : ''}`;
        card.setAttribute('data-id', resItem.id);

        // Quality Pill
        let pillHtml = '';
        const h = resItem.height || 0;
        if (resItem.type === 'audio') {
          pillHtml = `<span class="res-pill res-pill-audio">${t('audioOnly')}</span>`;
        } else if (h >= 2160) {
          pillHtml = `<span class="res-pill res-pill-4k">4K UHD</span>`;
        } else if (h >= 1440) {
          pillHtml = `<span class="res-pill res-pill-2k">2K QHD</span>`;
        } else if (h >= 1080) {
          pillHtml = `<span class="res-pill res-pill-1080">1080p FHD</span>`;
        } else if (h >= 720) {
          pillHtml = `<span class="res-pill res-pill-720">720p HD</span>`;
        }
        if (resItem.isRecommended || resItem.recommended) {
          pillHtml += `<span class="res-pill res-pill-rec">${t('recommended')}</span>`;
        }

        // Sub detail
        let subDetail = '';
        if (resItem.type === 'audio') {
          subDetail = t('audioOnly') || 'MP3 · Audio';
        } else {
          const fpsText = resItem.fps ? `${resItem.fps}fps` : '';
          const extText = (resItem.ext || 'MP4').toUpperCase();
          subDetail = [extText, fpsText].filter(Boolean).join(' · ');
        }

        const sizeText = resItem.filesize > 0 ? formatFileSize(resItem.filesize) : '';

        card.innerHTML = `
          <div class="res-card-left">
            <div class="res-radio-circle">
              <div class="res-radio-dot"></div>
            </div>
            <div class="res-card-info">
              <div class="res-card-label-row">
                <span class="res-card-label">${resItem.label || (h ? `${h}p` : 'Standard')}</span>
                ${pillHtml}
              </div>
              <div class="res-card-sub">${subDetail}</div>
            </div>
          </div>
          <div class="res-card-right">
            <span>${sizeText}</span>
          </div>
        `;

        card.addEventListener('click', () => {
          document.querySelectorAll('.res-card').forEach(c => c.classList.remove('active'));
          card.classList.add('active');
          selectedResolution = resItem;
          updateModalSummary();
        });

        // Double click to directly confirm and download
        card.addEventListener('dblclick', () => {
          selectedResolution = resItem;
          btnModalDownload.click();
        });

        resOptionsList.appendChild(card);
      });

      updateModalSummary();
      // Disable webview pointer events while modal is active to prevent click stealing
      if (webview) webview.style.pointerEvents = 'none';
      resolutionModal.style.display = 'flex';
    }

    function updateModalSummary() {
      if (!selectedResolution) {
        modalSummaryText.innerText = '—';
        return;
      }
      const label = selectedResolution.label || (selectedResolution.height ? `${selectedResolution.height}p` : 'Video');
      const approxPrefix = currentLocale && currentLocale.startsWith('zh') ? '约 ' : '~';
      const size = selectedResolution.filesize > 0 ? ` · ${approxPrefix}${formatFileSize(selectedResolution.filesize)}` : '';
      modalSummaryText.innerText = `${label}${size}`;
    }

    function closeResolutionModal() {
      resolutionModal.style.display = 'none';
      if (webview) webview.style.pointerEvents = 'auto';
      currentParsedVideo = null;
    }

    btnModalClose.addEventListener('click', closeResolutionModal);
    btnModalCancel.addEventListener('click', closeResolutionModal);
    resolutionModal.addEventListener('click', (e) => {
      if (e.target === resolutionModal) closeResolutionModal();
    });

    // Confirm and download selected resolution
    btnModalDownload.addEventListener('click', async () => {
      if (!currentParsedVideo || !selectedResolution) return;
      const targetVideo = currentParsedVideo;
      const targetRes = selectedResolution;
      closeResolutionModal();

      try {
        showHud(t('hudQueued'), targetVideo.title, 0, t('hudEngine'));
        if (window.api?.triggerSnifferDownload) {
          await window.api.triggerSnifferDownload({
            url: targetVideo.webpage_url || webview.getURL(),
            title: targetVideo.title,
            thumbnail: targetVideo.thumbnail,
            duration: targetVideo.duration,
            extractor: targetVideo.extractor,
            resolution: targetRes,
            videoInfo: targetVideo
          });
        }
      } catch (e) {
        console.error('Trigger sniffer download error:', e);
      }
    });

    // 9. CTA Sniff and Parse Button Handler
    btnSniff.addEventListener('click', async () => {
      if (isParsing) return;
      try {
        const url = webview.getURL();
        const title = webview.getTitle() || t('parseBtn') || 'Web Video';
        if (!url || url.startsWith('data:')) return;

        isParsing = true;
        btnSniff.disabled = true;
        btnSniffIcon.className = 'spin';
        btnSniffIcon.innerText = '⏳';
        btnSniffText.innerText = t('parsingBtn');

        showHud(t('hudParsing'), title, 0, t('hudEngine'));

        // Call backend YT-DLP parser directly
        if (!window.api?.getYtVideoInfo) {
          throw new Error('API getYtVideoInfo is not available');
        }

        const res = await window.api.getYtVideoInfo(url);

        if (res && res.success && res.resolutions && res.resolutions.length > 0) {
          // Open Resolution Selection Modal
          openResolutionModal(res);
        } else {
          const errMsg = res?.error || t('parseFailedDesc');
          showHud(t('parseFailed'), errMsg, 0, 'Error');
        }
      } catch (e) {
        console.error('Sniffer parse error:', e);
        showHud(t('parseFailed'), e.message || String(e), 0, 'Error');
      } finally {
        isParsing = false;
        btnSniff.disabled = false;
        btnSniffIcon.className = '';
        btnSniffIcon.innerText = '✨';
        btnSniffText.innerText = t('parseBtn');
      }
    });

    // Keyboard shortcuts: ESC to close modal, Enter to start download
    window.addEventListener('keydown', (e) => {
      if (resolutionModal.style.display === 'flex') {
        if (e.key === 'Escape') {
          closeResolutionModal();
        } else if (e.key === 'Enter') {
          btnModalDownload.click();
        }
      }
    });

    // 10. Progress listener from main process
    if (window.api?.onSnifferProgress) {
      window.api.onSnifferProgress((data) => {
        if (!data) return;
        const progress = Math.round(data.progress || 0);
        showHud(
          data.status === 'Completed' ? t('hudCompleted') : t('hudDownloading'),
          data.title || t('parseBtn') || 'Video Task',
          progress,
          data.speed ? `${data.speed} · ETA: ${data.eta || t('calculating')}` : data.status
        );
      });
    }

    // 11. External target handling
    webview.addEventListener('new-window', (e) => {
      e.preventDefault();
      if (e.url) webview.loadURL(e.url);
    });

    // 12. Remote navigation listener
    if (window.api?.onSnifferNavigate) {
      window.api.onSnifferNavigate((url) => {
        if (url && webview) {
          console.log('[Sniffer Browser] Remote navigate requested:', url);
          webview.loadURL(url);
        }
      });
    }

    // 13. Remote locale updated listener
    if (window.api?.onSnifferLocaleUpdated) {
      window.api.onSnifferLocaleUpdated((newLang) => {
        if (newLang) applyLocale(newLang);
      });
    }

    // Initial URL sync & query parameter inspection
    window.addEventListener('DOMContentLoaded', () => {
      try {
        const urlParams = new URLSearchParams(window.location.search);
        const initialLang = urlParams.get('lang');
        if (initialLang) {
          applyLocale(initialLang);
        } else {
          const savedLocale = localStorage.getItem('shareclip_locale');
          applyLocale(savedLocale || 'zh');
        }

        const initialUrl = urlParams.get('url');
        if (initialUrl && webview) {
          webview.src = initialUrl;
        }
      } catch (e) {}
      updateNavState();
    });
  </script>
</body>
</html>
